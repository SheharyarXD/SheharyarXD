<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1px; }
      .mono-blue { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58A6FF; letter-spacing: 2px; }
      .mono-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; letter-spacing: 1px; }
      .group-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .chip-name { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .chip-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8B949E; }
      .status-pill { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #58A6FF; font-weight: 600; letter-spacing: 1px; }
      .glow-blue { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.4)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.4)); }
    </style>

    <linearGradient id="header-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#233554" stop-opacity="0.05" />
    </linearGradient>

    <pattern id="grid-pattern-tech" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#05070A" />
  <rect width="100%" height="100%" fill="url(#grid-pattern-tech)" />

  <!-- Outer Frame -->
  <rect x="20" y="16" width="1160" height="438" rx="8" fill="#0A0E14" fill-opacity="0.7" stroke="#233554" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 30 L 20 16 L 34 16" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 30 L 1180 16 L 1166 16" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 20 440 L 20 454 L 34 454" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 440 L 1180 454 L 1166 454" stroke="#58A6FF" stroke-width="2" fill="none" />

  <!-- Section Header Bar -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" class="mono-blue glow-blue">02 // TECHNOLOGY SYSTEM</text>
    <text x="215" y="0" class="mono-dim">// MODULAR ARCHITECTURE &amp; COMPONENT MATRIX</text>
    <circle cx="1060" cy="-4" r="3.5" fill="#58A6FF" class="glow-blue">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="1075" y="0" class="mono-cyan">STACK_ONLINE</text>
    <line x1="0" y1="14" x2="1100" y2="14" stroke="url(#header-line)" stroke-width="1" />
  </g>

  <!-- ==================== PANEL 1: FRONTEND (TOP LEFT) ==================== -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="670" height="165" rx="6" fill="#0D131E" fill-opacity="0.85" stroke="#233554" stroke-width="1" />
    <!-- Panel Header -->
    <rect x="0" y="0" width="670" height="32" rx="6" fill="#131C2A" />
    <circle cx="16" cy="16" r="3.5" fill="#58A6FF" />
    <text x="28" y="20" class="group-title">01 / FRONTEND &amp; INTERACTIVE GRAPHICS</text>
    <text x="650" y="20" class="status-pill" text-anchor="end">60 FPS // WEBGL ACCEL</text>

    <!-- Tech Chips Row 1 -->
    <g transform="translate(18, 48)">
      <!-- Next.js -->
      <rect x="0" y="0" width="195" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="18" cy="23" r="5" fill="#00F0FF" />
      <text x="32" y="21" class="chip-name">Next.js</text>
      <text x="32" y="36" class="chip-sub">App Router &amp; SSR Engine</text>

      <!-- React -->
      <rect x="210" y="0" width="195" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="228" cy="23" r="5" fill="#58A6FF" />
      <text x="242" y="21" class="chip-name">React</text>
      <text x="242" y="36" class="chip-sub">Component Core &amp; Hooks</text>

      <!-- Three.js -->
      <rect x="420" y="0" width="232" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="438" cy="23" r="5" fill="#00F0FF" />
      <text x="452" y="21" class="chip-name">Three.js</text>
      <text x="452" y="36" class="chip-sub">3D Scenes &amp; Raymarching</text>
    </g>

    <!-- Tech Chips Row 2 -->
    <g transform="translate(18, 104)">
      <!-- WebGL -->
      <rect x="0" y="0" width="195" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="18" cy="23" r="5" fill="#58A6FF" />
      <text x="32" y="21" class="chip-name">WebGL</text>
      <text x="32" y="36" class="chip-sub">Hardware Shaders (GLSL)</text>

      <!-- TypeScript -->
      <rect x="210" y="0" width="195" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="228" cy="23" r="5" fill="#00F0FF" />
      <text x="242" y="21" class="chip-name">TypeScript</text>
      <text x="242" y="36" class="chip-sub">Strict Type Architecture</text>

      <!-- TailwindCSS -->
      <rect x="420" y="0" width="232" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="438" cy="23" r="5" fill="#58A6FF" />
      <text x="452" y="21" class="chip-name">TailwindCSS</text>
      <text x="452" y="36" class="chip-sub">Design Token Utility Engine</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: ENTERPRISE (TOP RIGHT) ==================== -->
  <g transform="translate(738, 85)">
    <rect x="0" y="0" width="412" height="165" rx="6" fill="#0D131E" fill-opacity="0.85" stroke="#233554" stroke-width="1" />
    <!-- Panel Header -->
    <rect x="0" y="0" width="412" height="32" rx="6" fill="#131C2A" />
    <circle cx="16" cy="16" r="3.5" fill="#00F0FF" />
    <text x="28" y="20" class="group-title">02 / BUSINESS &amp; ENTERPRISE</text>
    <text x="396" y="20" class="status-pill" text-anchor="end">ERP CORE</text>

    <!-- Tech Chips -->
    <g transform="translate(18, 48)">
      <!-- Odoo Enterprise -->
      <rect x="0" y="0" width="376" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="18" cy="23" r="5" fill="#58A6FF" />
      <text x="32" y="21" class="chip-name">Odoo Enterprise</text>
      <text x="32" y="36" class="chip-sub">Custom Modules, ORM &amp; Workflow Automations</text>
    </g>

    <g transform="translate(18, 104)">
      <!-- ERP Architecture -->
      <rect x="0" y="0" width="376" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="18" cy="23" r="5" fill="#00F0FF" />
      <text x="32" y="21" class="chip-name">ERP Architecture</text>
      <text x="32" y="36" class="chip-sub">Relational Schema Design &amp; Business Process Pipelines</text>
    </g>
  </g>

  <!-- ==================== PANEL 3: BACKEND SERVICES (BOTTOM LEFT) ==================== -->
  <g transform="translate(50, 265)">
    <rect x="0" y="0" width="535" height="165" rx="6" fill="#0D131E" fill-opacity="0.85" stroke="#233554" stroke-width="1" />
    <!-- Panel Header -->
    <rect x="0" y="0" width="535" height="32" rx="6" fill="#131C2A" />
    <circle cx="16" cy="16" r="3.5" fill="#58A6FF" />
    <text x="28" y="20" class="group-title">03 / DISTRIBUTED BACKEND SERVICES</text>
    <text x="515" y="20" class="status-pill" text-anchor="end">ASYNC // REST</text>

    <!-- Chips Row 1 -->
    <g transform="translate(18, 48)">
      <!-- C# / .NET -->
      <rect x="0" y="0" width="158" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="16" cy="23" r="5" fill="#58A6FF" />
      <text x="30" y="21" class="chip-name">C# / .NET</text>
      <text x="30" y="36" class="chip-sub">High-Perf Microservices</text>

      <!-- Python -->
      <rect x="170" y="0" width="158" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="186" cy="23" r="5" fill="#00F0FF" />
      <text x="200" y="21" class="chip-name">Python</text>
      <text x="200" y="36" class="chip-sub">AI &amp; Neural Scripting</text>

      <!-- Node.js / Express -->
      <rect x="340" y="0" width="158" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="356" cy="23" r="5" fill="#58A6FF" />
      <text x="370" y="21" class="chip-name">Node.js</text>
      <text x="370" y="36" class="chip-sub">Express Runtime</text>
    </g>

    <!-- Chips Row 2 -->
    <g transform="translate(18, 104)">
      <!-- REST / GraphQL -->
      <rect x="0" y="0" width="498" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="16" cy="23" r="5" fill="#00F0FF" />
      <text x="30" y="21" class="chip-name">REST / GraphQL API Gateways</text>
      <text x="30" y="36" class="chip-sub">Low-Latency Endpoint Contracts &amp; Subscriptions</text>
    </g>
  </g>

  <!-- ==================== PANEL 4: INFRASTRUCTURE & DATA (BOTTOM RIGHT) ==================== -->
  <g transform="translate(600, 265)">
    <rect x="0" y="0" width="550" height="165" rx="6" fill="#0D131E" fill-opacity="0.85" stroke="#233554" stroke-width="1" />
    <!-- Panel Header -->
    <rect x="0" y="0" width="550" height="32" rx="6" fill="#131C2A" />
    <circle cx="16" cy="16" r="3.5" fill="#00F0FF" />
    <text x="28" y="20" class="group-title">04 / CLOUD INFRASTRUCTURE &amp; DATA MATRIX</text>
    <text x="532" y="20" class="status-pill" text-anchor="end">FAULT-TOLERANT</text>

    <!-- Chips Row 1 -->
    <g transform="translate(18, 48)">
      <!-- MongoDB -->
      <rect x="0" y="0" width="160" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="16" cy="23" r="5" fill="#00F0FF" />
      <text x="30" y="21" class="chip-name">MongoDB</text>
      <text x="30" y="36" class="chip-sub">Distributed NoSQL</text>

      <!-- Docker -->
      <rect x="175" y="0" width="160" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="191" cy="23" r="5" fill="#58A6FF" />
      <text x="205" y="21" class="chip-name">Docker</text>
      <text x="205" y="36" class="chip-sub">Container Mesh</text>

      <!-- Azure -->
      <rect x="350" y="0" width="164" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="366" cy="23" r="5" fill="#00F0FF" />
      <text x="380" y="21" class="chip-name">Azure</text>
      <text x="380" y="36" class="chip-sub">Enterprise Cloud</text>
    </g>

    <!-- Chips Row 2 -->
    <g transform="translate(18, 104)">
      <!-- Linux -->
      <rect x="0" y="0" width="160" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="16" cy="23" r="5" fill="#58A6FF" />
      <text x="30" y="21" class="chip-name">Linux</text>
      <text x="30" y="36" class="chip-sub">POSIX System Kernel</text>

      <!-- Git -->
      <rect x="175" y="0" width="160" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="191" cy="23" r="5" fill="#00F0FF" />
      <text x="205" y="21" class="chip-name">Git</text>
      <text x="205" y="36" class="chip-sub">VCS &amp; CI Workflows</text>

      <!-- Vercel -->
      <rect x="350" y="0" width="164" height="46" rx="4" fill="#101826" stroke="#1F2937" stroke-width="1" />
      <circle cx="366" cy="23" r="5" fill="#58A6FF" />
      <text x="380" y="21" class="chip-name">Vercel</text>
      <text x="380" y="36" class="chip-sub">Edge Global Routing</text>
    </g>
  </g>
</svg>

