<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1px; }
      .mono-blue { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58A6FF; letter-spacing: 1.5px; }
      .mono-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; letter-spacing: 1px; }
      .proj-title { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .proj-desc { font-family: 'Space Grotesk', sans-serif; font-size: 14px; fill: #C9D1D9; font-weight: 400; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #58A6FF; font-weight: 600; }
      .cta-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #58A6FF; font-weight: 700; letter-spacing: 1px; }
      .glow-blue { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.45)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.45)); }
    </style>

    <radialGradient id="proj1-glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-p1" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#05070A" />
  <rect width="100%" height="100%" fill="url(#grid-p1)" />
  <circle cx="220" cy="160" r="220" fill="url(#proj1-glow)" />

  <!-- Outer Structural Chassis -->
  <rect x="20" y="10" width="1160" height="300" rx="8" fill="#0A0E15" fill-opacity="0.85" stroke="#233554" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 26 L 20 10 L 36 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 26 L 1180 10 L 1164 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 20 294 L 20 310 L 36 310" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 294 L 1180 310 L 1164 310" stroke="#58A6FF" stroke-width="2" fill="none" />

  <!-- ==================== LEFT: VISUAL SCHEMATIC (NEURAL DAG) ==================== -->
  <g transform="translate(45, 30)">
    <!-- Schematic Frame -->
    <rect x="0" y="0" width="400" height="260" rx="6" fill="#080C12" stroke="#1F2937" stroke-width="1" />
    
    <!-- Schematic Header -->
    <text x="16" y="22" class="mono-dim">SCHEMATIC: DAG_PIPELINE // SYNAPSE_BUS</text>
    <circle cx="380" cy="18" r="3" fill="#00F0FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Pipeline DAG Nodes and Interconnects -->
    <g transform="translate(25, 45)">
      <!-- Connecting Bus Lines -->
      <path d="M 60 40 L 140 40 L 140 85 L 210 85" stroke="#233554" stroke-width="1.5" fill="none" />
      <path d="M 60 130 L 140 130 L 140 85 L 210 85" stroke="#233554" stroke-width="1.5" fill="none" />
      <path d="M 270 85 L 330 85" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="4, 4" fill="none" />

      <!-- Node 1: Input Telemetry -->
      <rect x="0" y="20" width="60" height="40" rx="4" fill="#0E1622" stroke="#58A6FF" stroke-width="1" />
      <text x="30" y="38" class="mono-dim" text-anchor="middle" font-size="9px">INPUT</text>
      <text x="30" y="50" class="mono-cyan" text-anchor="middle" font-size="8px">STREAM</text>

      <!-- Node 2: Sensor Ingestion -->
      <rect x="0" y="110" width="60" height="40" rx="4" fill="#0E1622" stroke="#233554" stroke-width="1" />
      <text x="30" y="128" class="mono-dim" text-anchor="middle" font-size="9px">CONTEXT</text>
      <text x="30" y="140" class="mono-dim" text-anchor="middle" font-size="8px">STORE</text>

      <!-- Central Node: Neural Processing Engine -->
      <g transform="translate(190, 60)">
        <rect x="0" y="0" width="90" height="50" rx="6" fill="#121D2C" stroke="#00F0FF" stroke-width="1.5" class="glow-cyan" />
        <circle cx="45" cy="25" r="14" fill="none" stroke="#58A6FF" stroke-width="1" stroke-dasharray="3, 3">
          <animateTransform attributeName="transform" type="rotate" from="0 45 25" to="360 45 25" dur="10s" repeatCount="indefinite" />
        </circle>
        <circle cx="45" cy="25" r="4" fill="#00F0FF" />
        <text x="45" y="44" class="mono-cyan" text-anchor="middle" font-size="8px">AI_CORE</text>
      </g>

      <!-- Node 4: Synthesis Output -->
      <rect x="315" y="65" width="55" height="40" rx="4" fill="#0E1622" stroke="#58A6FF" stroke-width="1" />
      <text x="342" y="83" class="mono-blue" text-anchor="middle" font-size="9px">ACTION</text>
      <text x="342" y="95" class="mono-cyan" text-anchor="middle" font-size="8px">DISPATCH</text>
    </g>

    <!-- Schematic Bottom Readout -->
    <rect x="0" y="235" width="400" height="25" rx="0" fill="#0A0E14" />
    <text x="16" y="251" class="mono-dim">LATENCY: <tspan fill="#00F0FF">18ms</tspan></text>
    <text x="150" y="251" class="mono-dim">INFERENCE: <tspan fill="#58A6FF">PARALLEL</tspan></text>
    <text x="384" y="251" class="mono-cyan" text-anchor="end">STATUS: OK</text>
  </g>

  <!-- ==================== RIGHT: INFORMATION & METADATA ==================== -->
  <g transform="translate(480, 42)">
    <!-- Top Category & Number Row -->
    <text x="0" y="0" class="mono-blue glow-blue">SYS.ARCH // 01</text>
    <text x="125" y="0" class="mono-dim">|</text>
    <text x="145" y="0" class="mono-cyan">AI / AUTOMATION PIPELINE</text>
    <rect x="580" y="-12" width="85" height="20" rx="3" fill="#111A29" stroke="#00F0FF" stroke-width="1" />
    <text x="622" y="1" class="badge-text" fill="#00F0FF" text-anchor="middle">ACTIVE</text>

    <!-- Project Title -->
    <text x="0" y="42" class="proj-title">ai-automation-engine</text>
    <text x="0" y="66" class="mono-dim">Autonomous Reasoning &amp; Multi-Agent Workflow Orchestrator</text>

    <!-- Divider -->
    <line x1="0" y1="82" x2="665" y2="82" stroke="#1F2937" stroke-width="1" />

    <!-- Project Description -->
    <text x="0" y="112" class="proj-desc">High-throughput automation pipeline executing continuous multi-stage task</text>
    <text x="0" y="134" class="proj-desc">synthesis, deterministic tool calls, and real-time state machine transitions.</text>
    <text x="0" y="156" class="proj-desc">Engineered for autonomous resilience and enterprise-grade fault handling.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="40" y="16" class="badge-text" text-anchor="middle">Python</text>

      <rect x="90" y="0" width="125" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="152" y="16" class="badge-text" text-anchor="middle">Neural Pipelines</text>

      <rect x="225" y="0" width="115" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="282" y="16" class="badge-text" text-anchor="middle">State Machine</text>

      <rect x="350" y="0" width="105" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="402" y="16" class="badge-text" text-anchor="middle">REST Gateways</text>
    </g>

    <!-- Clickable CTA Box Hint -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="300" height="32" rx="4" fill="#111B2B" stroke="#58A6FF" stroke-width="1" />
      <text x="16" y="20" class="cta-text">ACCESS_REPOSITORY: ai-automation-engine ↗</text>
    </g>
  </g>
</svg>

