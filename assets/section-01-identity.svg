<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1.5px; }
      .mono-blue { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58A6FF; letter-spacing: 2px; }
      .mono-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; letter-spacing: 1px; }
      .head-title { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .body-text { font-family: 'Space Grotesk', sans-serif; font-size: 15px; fill: #C9D1D9; font-weight: 400; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #58A6FF; font-weight: 600; letter-spacing: 1px; }
      .spec-key { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1px; }
      .spec-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #FFFFFF; font-weight: 500; }
      .spec-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; font-weight: 600; }
      .glow-blue { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.45)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.45)); }
    </style>

    <radialGradient id="ident-glow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#233554" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#05070A" />
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />
  <circle cx="150" cy="120" r="320" fill="url(#ident-glow)" />

  <!-- Outer Structural Hairline Border -->
  <rect x="20" y="16" width="1160" height="358" rx="8" fill="#0A0E14" fill-opacity="0.75" stroke="#233554" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 30 L 20 16 L 34 16" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 30 L 1180 16 L 1166 16" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 20 360 L 20 374 L 34 374" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 360 L 1180 374 L 1166 374" stroke="#58A6FF" stroke-width="2" fill="none" />

  <!-- Section Header Bar -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" class="mono-blue glow-blue">01 // SYSTEM SPECIFICATION</text>
    <text x="240" y="0" class="mono-dim">// ARCHITECTURAL IDENTITY &amp; CORE FOCUS</text>
    <circle cx="1060" cy="-4" r="3.5" fill="#00F0FF" class="glow-cyan">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="1075" y="0" class="mono-cyan">TELEMETRY_SYNC</text>
    <line x1="0" y1="14" x2="1100" y2="14" stroke="url(#line-grad)" stroke-width="1" />
  </g>

  <!-- Left Editorial Column -->
  <g transform="translate(50, 95)">
    <!-- Main High-Impact Typography -->
    <text x="0" y="32" class="head-title">ARCHITECTING HIGH-PERFORMANCE</text>
    <text x="0" y="68" class="head-title">
      <tspan fill="#FFFFFF">INTELLIGENT SYSTEMS </tspan>
      <tspan fill="#58A6FF" class="glow-blue">&amp; SAAS CORE</tspan>
    </text>

    <!-- Editorial Narrative -->
    <text x="0" y="116" class="body-text">Operating at the convergence of autonomous AI engineering, distributed backend</text>
    <text x="0" y="140" class="body-text">infrastructure, and interactive WebGL user experiences. Dedicated to translating complex</text>
    <text x="0" y="164" class="body-text">enterprise constraints into resilient, sub-millisecond, deeply optimized software ecosystems.</text>

    <!-- Technical Badges -->
    <g transform="translate(0, 198)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="168" height="26" rx="4" fill="#111A29" stroke="#233554" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#58A6FF" />
      <text x="22" y="17" class="badge-text">SYSTEM ARCHITECTURE</text>

      <!-- Badge 2 -->
      <rect x="178" y="0" width="138" height="26" rx="4" fill="#111A29" stroke="#233554" stroke-width="1" />
      <circle cx="190" cy="13" r="2.5" fill="#00F0FF" />
      <text x="200" y="17" class="badge-text" fill="#00F0FF">AI AUTOMATION</text>

      <!-- Badge 3 -->
      <rect x="326" y="0" width="170" height="26" rx="4" fill="#111A29" stroke="#233554" stroke-width="1" />
      <circle cx="338" cy="13" r="2.5" fill="#58A6FF" />
      <text x="348" y="17" class="badge-text">DISTRIBUTED SYSTEMS</text>

      <!-- Badge 4 -->
      <rect x="506" y="0" width="144" height="26" rx="4" fill="#111A29" stroke="#233554" stroke-width="1" />
      <circle cx="518" cy="13" r="2.5" fill="#00F0FF" />
      <text x="528" y="17" class="badge-text" fill="#00F0FF">WebGL &amp; 3D UI</text>
    </g>
  </g>

  <!-- Right Technical Spec Chassis (Glass HUD) -->
  <g transform="translate(740, 85)">
    <!-- Chassis Box -->
    <rect x="0" y="0" width="410" height="260" rx="6" fill="#0D131D" fill-opacity="0.9" stroke="#233554" stroke-width="1" />
    
    <!-- Top HUD Bar -->
    <rect x="0" y="0" width="410" height="34" rx="6" fill="#131C2A" />
    <circle cx="20" cy="17" r="4" fill="#58A6FF" class="glow-blue" />
    <text x="32" y="21" class="mono-blue">SYS.METRIC // CAPABILITY PROFILE</text>
    <text x="390" y="21" class="mono-dim" text-anchor="end">STATUS: NOMINAL</text>

    <!-- Specs List -->
    <g transform="translate(20, 56)">
      <text x="0" y="12" class="spec-key">DISCIPLINE</text>
      <text x="130" y="12" class="spec-val">Systems Architect // AI Engineer</text>
      <line x1="0" y1="24" x2="370" y2="24" stroke="#1F2937" stroke-width="0.75" />

      <text x="0" y="44" class="spec-key">CORE DOMAIN</text>
      <text x="130" y="44" class="spec-val">Autonomous Agents &amp; Neural Pipelines</text>
      <line x1="0" y1="56" x2="370" y2="56" stroke="#1F2937" stroke-width="0.75" />

      <text x="0" y="76" class="spec-key">GRAPHICS ENGINE</text>
      <text x="130" y="76" class="spec-cyan">Three.js / WebGL / Shaders</text>
      <line x1="0" y1="88" x2="370" y2="88" stroke="#1F2937" stroke-width="0.75" />

      <text x="0" y="108" class="spec-key">INFRASTRUCTURE</text>
      <text x="130" y="108" class="spec-val">Distributed Docker / Azure Cloud</text>
      <line x1="0" y1="120" x2="370" y2="120" stroke="#1F2937" stroke-width="0.75" />

      <text x="0" y="140" class="spec-key">LATENCY TARGET</text>
      <text x="130" y="140" class="spec-cyan">&lt; 16ms Frame-Budget / Sub-50ms API</text>
      <line x1="0" y1="152" x2="370" y2="152" stroke="#1F2937" stroke-width="0.75" />

      <text x="0" y="172" class="spec-key">PARADIGM</text>
      <text x="130" y="172" class="spec-val">Strict Type Safety ⎔ Fault Tolerant</text>
    </g>

    <!-- Bottom HUD Status Line -->
    <rect x="1" y="234" width="408" height="25" rx="0" fill="#0A0E16" />
    <text x="20" y="250" class="mono-dim">SECURITY: STRICT</text>
    <text x="390" y="250" class="mono-cyan" text-anchor="end">KERNEL: VERIFIED // READY</text>
  </g>
</svg>

