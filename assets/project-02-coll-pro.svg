<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1px; }
      .mono-blue { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58A6FF; letter-spacing: 1.5px; }
      .mono-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; letter-spacing: 1px; }
      .proj-title { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .proj-desc { font-family: 'Space Grotesk', sans-serif; font-size: 14px; fill: #C9D1D9; font-weight: 400; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #58A6FF; font-weight: 600; }
      .cta-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #58A6FF; font-weight: 700; letter-spacing: 1px; }
      .glow-blue { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.45)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.45)); }
    </style>

    <radialGradient id="p2-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-p2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#05070A" />
  <rect width="100%" height="100%" fill="url(#grid-p2)" />
  <circle cx="980" cy="160" r="220" fill="url(#p2-glow)" />

  <!-- Outer Structural Chassis -->
  <rect x="20" y="10" width="1160" height="300" rx="8" fill="#0A0E15" fill-opacity="0.85" stroke="#233554" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 26 L 20 10 L 36 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 26 L 1180 10 L 1164 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 20 294 L 20 310 L 36 310" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 294 L 1180 310 L 1164 310" stroke="#58A6FF" stroke-width="2" fill="none" />

  <!-- ==================== LEFT: INFORMATION & METADATA ==================== -->
  <g transform="translate(50, 42)">
    <!-- Top Category & Number Row -->
    <text x="0" y="0" class="mono-blue glow-blue">SYS.PRJ // 02</text>
    <text x="125" y="0" class="mono-dim">|</text>
    <text x="145" y="0" class="mono-cyan">ENTERPRISE SAAS &amp; WORKFLOW AUTOMATION</text>
    <rect x="580" y="-12" width="85" height="20" rx="3" fill="#111A29" stroke="#58A6FF" stroke-width="1" />
    <text x="622" y="1" class="badge-text" text-anchor="middle">ACTIVE</text>

    <!-- Project Title -->
    <text x="0" y="42" class="proj-title">Coll-Pro</text>
    <text x="0" y="66" class="mono-dim">Advanced Debt Collection Management &amp; Automated Recovery System</text>

    <!-- Divider -->
    <line x1="0" y1="82" x2="665" y2="82" stroke="#1F2937" stroke-width="1" />

    <!-- Project Description -->
    <text x="0" y="112" class="proj-desc">Centralized enterprise platform built to help collection agencies orchestrate, track, and</text>
    <text x="0" y="134" class="proj-desc">automate their end-to-end debt recovery workflow. Designed with strict audit compliance,</text>
    <text x="0" y="156" class="proj-desc">relational state modeling, and automated communications from a unified core interface.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="95" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="47" y="16" class="badge-text" text-anchor="middle">TypeScript</text>

      <rect x="105" y="0" width="130" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="170" y="16" class="badge-text" text-anchor="middle">Enterprise SaaS</text>

      <rect x="245" y="0" width="125" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="307" y="16" class="badge-text" text-anchor="middle">Workflow Engine</text>

      <rect x="380" y="0" width="115" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="437" y="16" class="badge-text" text-anchor="middle">Audit Integrity</text>
    </g>

    <!-- Clickable CTA Box Hint -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="260" height="32" rx="4" fill="#111B2B" stroke="#58A6FF" stroke-width="1" />
      <text x="16" y="20" class="cta-text">ACCESS_REPOSITORY: Coll-Pro ↗</text>
    </g>
  </g>

  <!-- ==================== RIGHT: VISUAL SCHEMATIC (ENTERPRISE WORKFLOW) ==================== -->
  <g transform="translate(755, 30)">
    <!-- Schematic Frame -->
    <rect x="0" y="0" width="400" height="260" rx="6" fill="#080C12" stroke="#1F2937" stroke-width="1" />
    
    <!-- Schematic Header -->
    <text x="16" y="22" class="mono-dim">ARCHITECTURE: RECOVERY_PIPELINE // AUDIT_BUS</text>
    <circle cx="380" cy="18" r="3" fill="#58A6FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Workflow Diagram -->
    <g transform="translate(25, 45)">
      <!-- Entity 1: Claims Ingestion -->
      <rect x="0" y="10" width="140" height="60" rx="4" fill="#0E1624" stroke="#58A6FF" stroke-width="1" />
      <rect x="0" y="10" width="140" height="20" rx="4" fill="#131F33" />
      <text x="12" y="24" class="mono-cyan" font-size="9px">DEBT_REGISTRY</text>
      <text x="12" y="44" class="mono-dim" font-size="8px">:: claims.batch_sync</text>
      <text x="12" y="56" class="mono-dim" font-size="8px">:: debtor.profile</text>

      <!-- Entity 2: Automated Recovery -->
      <rect x="210" y="10" width="140" height="60" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <rect x="210" y="10" width="140" height="20" rx="4" fill="#131C2A" />
      <text x="222" y="24" class="mono-blue" font-size="9px">RECOVERY_ACTION</text>
      <text x="222" y="44" class="mono-dim" font-size="8px">:: notify.automated</text>
      <text x="222" y="56" class="mono-dim" font-size="8px">:: settlement.negotiate</text>

      <!-- Connecting Lines -->
      <path d="M 140 40 L 210 40" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="3, 3" fill="none" />
      <path d="M 70 70 L 70 115 L 175 115 L 175 125" stroke="#233554" stroke-width="1.5" fill="none" />
      <path d="M 280 70 L 280 115 L 175 115 L 175 125" stroke="#233554" stroke-width="1.5" fill="none" />

      <!-- Entity 3: Central Audit Core -->
      <g transform="translate(90, 125)">
        <rect x="0" y="0" width="170" height="48" rx="4" fill="#111B2A" stroke="#00F0FF" stroke-width="1.2" class="glow-cyan" />
        <circle cx="20" cy="24" r="5" fill="#00F0FF" />
        <text x="35" y="20" class="mono-cyan" font-size="9px">AUDIT_LEDGER // CORE</text>
        <text x="35" y="34" class="mono-dim" font-size="8px">COMPLIANCE: 100% REGULATED</text>
      </g>
    </g>

    <!-- Schematic Bottom Readout -->
    <rect x="0" y="235" width="400" height="25" rx="0" fill="#0A0E14" />
    <text x="16" y="251" class="mono-dim">SECURITY: <tspan fill="#00F0FF">ENTERPRISE_RBAC</tspan></text>
    <text x="180" y="251" class="mono-dim">DISPATCH: <tspan fill="#58A6FF">AUTOMATED</tspan></text>
    <text x="384" y="251" class="mono-cyan" text-anchor="end">STATUS: VERIFIED</text>
  </g>
</svg>
