<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1px; }
      .mono-blue { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58A6FF; letter-spacing: 2px; }
      .mono-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; letter-spacing: 1px; }
      .glow-blue { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.5)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.5)); }
    </style>

    <linearGradient id="act-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#233554" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="grid-pattern-act" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#05070A" />
  <rect width="100%" height="100%" fill="url(#grid-pattern-act)" />

  <!-- Outer Frame -->
  <rect x="20" y="10" width="1160" height="90" rx="6" fill="#0A0E14" fill-opacity="0.85" stroke="#233554" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 25 L 20 10 L 35 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 25 L 1180 10 L 1165 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 20 85 L 20 100 L 35 100" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 85 L 1180 100 L 1165 100" stroke="#58A6FF" stroke-width="2" fill="none" />

  <!-- Header Content -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" class="mono-blue glow-blue">04 // CONTRIBUTION NETWORK</text>
    <text x="235" y="0" class="mono-dim">// DEVELOPMENT VELOCITY &amp; TIME-SERIES COMMIT CADENCE</text>
    <circle cx="1060" cy="-4" r="3.5" fill="#58A6FF" class="glow-blue">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="1075" y="0" class="mono-cyan">SYNCED</text>
    <line x1="0" y1="12" x2="1100" y2="12" stroke="url(#act-line)" stroke-width="1" />
  </g>

  <!-- Telemetry Row -->
  <g transform="translate(50, 78)">
    <text x="0" y="0" class="mono-dim">OSCILLOSCOPE: <tspan fill="#58A6FF">ACTIVE WAVEFORM</tspan></text>
    <text x="300" y="0" class="mono-dim">SAMPLING_WINDOW: <tspan fill="#FFFFFF">CONTINUOUS / 365D</tspan></text>
    <text x="640" y="0" class="mono-dim">SIGNAL_LOCK: <tspan fill="#00F0FF">STABLE (0 PACKET LOSS)</tspan></text>
    <text x="960" y="0" class="mono-dim">STATE: <tspan fill="#58A6FF">PRODUCTION</tspan></text>
  </g>
</svg>

