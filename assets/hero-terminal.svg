<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;family=JetBrains+Mono&amp;display=swap');
      .text-name { font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; fill: #FFFFFF; letter-spacing: 8px; }
      .text-role { font-family: 'JetBrains Mono', monospace; font-size: 18px; fill: #58A6FF; letter-spacing: 4px; }
      .text-ui { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #8B949E; }
      .glow { filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.6)); }
    </style>
    
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#05070A" />
  
  <!-- Subtle Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.5" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Core Glow -->
  <circle cx="600" cy="200" r="300" fill="url(#core-glow)" />

  <!-- Animated Rotating Rings -->
  <g transform="translate(600, 200)" class="glow">
    <!-- Ring 1 (Outer) -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#233554" stroke-width="1" stroke-dasharray="10, 20" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="400, 800" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    
    <!-- Ring 2 (Middle, Counter-rotating) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="100, 500" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
    </circle>
    
    <!-- Inner Data Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
      <circle cx="90" cy="0" r="3" fill="#58A6FF" />
      <circle cx="-90" cy="0" r="3" fill="#58A6FF" />
      <circle cx="0" cy="90" r="3" fill="#FFFFFF" />
      <circle cx="0" cy="-90" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography overlay -->
  <g text-anchor="middle" dominant-baseline="middle">
    <text x="600" y="180" class="text-name glow">SHEHARYAR ZAHID</text>
    <text x="600" y="240" class="text-role">SYSTEMS ARCHITECT // AI ENGINEER</text>
  </g>

  <!-- Decorative UI Elements -->
  <text x="40" y="40" class="text-ui">SYS.ID: 0x7A9B</text>
  <text x="40" y="60" class="text-ui">MEM: [||||||||--] 82%</text>
  
  <text x="1160" y="40" class="text-ui" text-anchor="end">INITIALIZING...</text>
  <text x="1160" y="60" class="text-ui" text-anchor="end">T-MINUS 0.00</text>
  
  <!-- Interactive CTA Hint -->
  <rect x="520" y="310" width="160" height="30" fill="none" stroke="#58A6FF" stroke-width="1" rx="4" />
  <text x="600" y="325" class="text-ui" text-anchor="middle" fill="#58A6FF">INITIATE_LINK</text>

  <!-- Animated Scanline -->
  <rect width="100%" height="20" fill="url(#scanline)" opacity="0.5">
    <animate attributeName="y" values="-20;420" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
