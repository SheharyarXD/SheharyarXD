<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1px; }
      .mono-blue { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58A6FF; letter-spacing: 2px; }
      .mono-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; letter-spacing: 1px; }
      .title-bold { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1.5px; }
      .glow-blue { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.5)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.5)); }
    </style>

    <linearGradient id="telemetry-bar-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#233554" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="grid-pattern-tele" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#05070A" />
  <rect width="100%" height="100%" fill="url(#grid-pattern-tele)" />

  <!-- Outer Structural Border -->
  <rect x="20" y="10" width="1160" height="100" rx="6" fill="#0A0E14" fill-opacity="0.85" stroke="#233554" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 25 L 20 10 L 35 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 25 L 1180 10 L 1165 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 20 95 L 20 110 L 35 110" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 95 L 1180 110 L 1165 110" stroke="#58A6FF" stroke-width="2" fill="none" />

  <!-- Content Elements -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" class="mono-blue glow-blue">03 // DEVELOPER TELEMETRY</text>
    <text x="235" y="0" class="mono-dim">// CODEBASE VELOCITY &amp; AGGREGATE SYSTEM GAUGES</text>
    
    <circle cx="1060" cy="-4" r="3.5" fill="#00F0FF" class="glow-cyan">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="1075" y="0" class="mono-cyan">STREAM_LIVE</text>
    <line x1="0" y1="12" x2="1100" y2="12" stroke="url(#telemetry-bar-line)" stroke-width="1" />
  </g>

  <!-- Sub-header HUD Readouts -->
  <g transform="translate(50, 85)">
    <text x="0" y="0" class="mono-dim">POLL_INTERVAL: <tspan fill="#58A6FF">REALTIME</tspan></text>
    <text x="260" y="0" class="mono-dim">DATA_SOURCE: <tspan fill="#FFFFFF">GITHUB_API_V4</tspan></text>
    <text x="540" y="0" class="mono-dim">UPTIME_INDEX: <tspan fill="#00F0FF">99.98% NOMINAL</tspan></text>
    <text x="820" y="0" class="mono-dim">INTEGRITY_CHECK: <tspan fill="#58A6FF">VERIFIED_STABLE</tspan></text>
  </g>
</svg>

