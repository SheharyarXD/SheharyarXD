<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; letter-spacing: 1px; }
      .mono-blue { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58A6FF; letter-spacing: 1.5px; }
      .mono-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00F0FF; letter-spacing: 1px; }
      .proj-title { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .proj-desc { font-family: 'Space Grotesk', sans-serif; font-size: 14px; fill: #C9D1D9; font-weight: 400; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #58A6FF; font-weight: 600; }
      .cta-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #58A6FF; font-weight: 700; letter-spacing: 1px; }
      .glow-blue { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.45)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.45)); }
    </style>

    <radialGradient id="p3-glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-p3" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1F2937" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#05070A" />
  <rect width="100%" height="100%" fill="url(#grid-p3)" />
  <circle cx="220" cy="160" r="220" fill="url(#p3-glow)" />

  <!-- Outer Structural Chassis -->
  <rect x="20" y="10" width="1160" height="300" rx="8" fill="#0A0E15" fill-opacity="0.85" stroke="#233554" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 26 L 20 10 L 36 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 26 L 1180 10 L 1164 10" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 20 294 L 20 310 L 36 310" stroke="#58A6FF" stroke-width="2" fill="none" />
  <path d="M 1180 294 L 1180 310 L 1164 310" stroke="#58A6FF" stroke-width="2" fill="none" />

  <!-- ==================== LEFT: VISUAL SCHEMATIC (COMPUTER VISION HUD) ==================== -->
  <g transform="translate(45, 30)">
    <!-- Schematic Frame -->
    <rect x="0" y="0" width="400" height="260" rx="6" fill="#080C12" stroke="#1F2937" stroke-width="1" />
    
    <!-- Schematic Header -->
    <text x="16" y="22" class="mono-dim">CV_INFERENCE: YOLO_TENSOR // EDGE_HUD</text>
    <circle cx="380" cy="18" r="3" fill="#00F0FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Computer Vision Viewport Graphic -->
    <g transform="translate(40, 45)">
      <!-- Simulated Camera Viewport -->
      <rect x="0" y="0" width="320" height="170" rx="4" fill="#0A0F17" stroke="#233554" stroke-width="1" />
      
      <!-- Scan Reticle Grid -->
      <line x1="160" y1="20" x2="160" y2="150" stroke="#1F2937" stroke-width="1" stroke-dasharray="4, 4" />
      <line x1="20" y1="85" x2="300" y2="85" stroke="#1F2937" stroke-width="1" stroke-dasharray="4, 4" />

      <!-- Bounding Box 1: Threat Object Detected -->
      <rect x="80" y="35" width="130" height="95" rx="2" fill="none" stroke="#00F0FF" stroke-width="1.5" class="glow-cyan" />
      <path d="M 80 45 L 80 35 L 90 35" stroke="#58A6FF" stroke-width="2.5" fill="none" />
      <path d="M 210 45 L 210 35 L 200 35" stroke="#58A6FF" stroke-width="2.5" fill="none" />
      <path d="M 80 120 L 80 130 L 90 130" stroke="#58A6FF" stroke-width="2.5" fill="none" />
      <path d="M 210 120 L 210 130 L 200 130" stroke="#58A6FF" stroke-width="2.5" fill="none" />
      
      <!-- Detection Label Tag -->
      <rect x="80" y="20" width="105" height="15" fill="#00F0FF" />
      <text x="85" y="31" font-family="'JetBrains Mono', monospace" font-size="8px" fill="#05070A" font-weight="700">OBJ_DETECT: 98.6%</text>

      <!-- Confidence Matrix on Side -->
      <g transform="translate(225, 45)">
        <text x="0" y="10" class="mono-dim" font-size="8px">TENSOR_VEC</text>
        <text x="0" y="24" class="mono-cyan" font-size="8px">[0.98, 0.01]</text>
        <text x="0" y="44" class="mono-dim" font-size="8px">CLASS_ID</text>
        <text x="0" y="58" class="mono-blue" font-size="8px">SECURITY_ALERT</text>
        <text x="0" y="76" class="mono-dim" font-size="8px">FPS_RATE</text>
        <text x="0" y="90" class="mono-cyan" font-size="8px">45.2 FPS</text>
      </g>
    </g>

    <!-- Schematic Bottom Readout -->
    <rect x="0" y="235" width="400" height="25" rx="0" fill="#0A0E14" />
    <text x="16" y="251" class="mono-dim">INFERENCE: <tspan fill="#00F0FF">&lt; 22ms</tspan></text>
    <text x="160" y="251" class="mono-dim">MODEL: <tspan fill="#58A6FF">NEURAL_YOLO</tspan></text>
    <text x="384" y="251" class="mono-cyan" text-anchor="end">EDGE_SYNC: READY</text>
  </g>

  <!-- ==================== RIGHT: INFORMATION & METADATA ==================== -->
  <g transform="translate(480, 42)">
    <!-- Top Category & Number Row -->
    <text x="0" y="0" class="mono-blue glow-blue">SYS.PRJ // 03</text>
    <text x="125" y="0" class="mono-dim">|</text>
    <text x="145" y="0" class="mono-cyan">COMPUTER VISION &amp; DEEP LEARNING</text>
    <rect x="560" y="-12" width="105" height="20" rx="3" fill="#111A29" stroke="#58A6FF" stroke-width="1" />
    <text x="612" y="1" class="badge-text" text-anchor="middle">ACTIVE</text>

    <!-- Project Title -->
    <text x="0" y="42" class="proj-title">Weapon-Detector</text>
    <text x="0" y="66" class="mono-dim">Real-Time Edge Computer Vision &amp; Neural Object Recognition</text>

    <!-- Divider -->
    <line x1="0" y1="82" x2="665" y2="82" stroke="#1F2937" stroke-width="1" />

    <!-- Project Description -->
    <text x="0" y="112" class="proj-desc">Deep-learning computer vision architecture engineered to identify weapons and security</text>
    <text x="0" y="134" class="proj-desc">anomalies in live video feeds with sub-30ms edge inference. Utilizes customized bounding</text>
    <text x="0" y="156" class="proj-desc">box regressions, temporal tracking, and automated security event telemetry dispatch.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="95" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="47" y="16" class="badge-text" text-anchor="middle">TypeScript</text>

      <rect x="105" y="0" width="125" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="167" y="16" class="badge-text" text-anchor="middle">Computer Vision</text>

      <rect x="240" y="0" width="115" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="297" y="16" class="badge-text" text-anchor="middle">Deep Learning</text>

      <rect x="365" y="0" width="115" height="24" rx="4" fill="#0E1624" stroke="#233554" stroke-width="1" />
      <text x="422" y="16" class="badge-text" text-anchor="middle">Edge Inference</text>
    </g>

    <!-- Clickable CTA Box Hint -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="295" height="32" rx="4" fill="#111B2B" stroke="#58A6FF" stroke-width="1" />
      <text x="16" y="20" class="cta-text">ACCESS_REPOSITORY: Weapon-Detector ↗</text>
    </g>
  </g>
</svg>
